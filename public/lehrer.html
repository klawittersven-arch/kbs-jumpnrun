<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d25">
<meta name="robots" content="noindex">
<title>Klassenmodus · KBS Jump-’n’-Run!</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/jr.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body class="teacher">
<main class="tapp">
  <header class="top">
    <div class="brandrow">
      <img src="img/logo.png" alt="Logo der Karoline-Breitinger-Schule" class="logo" width="44" height="44">
      <h1 class="brand">KBS Jump-’n’-Run! <span>Klassenmodus</span></h1>
    </div>
    <div class="tools">
      <span class="netdot" id="netdot" data-s="offline" title="Verbindung zum Server"></span>
      <span class="codechip" id="codeChip" hidden></span>
      <button class="chip" id="btnSound" type="button" aria-pressed="true">Ton: an</button>
      <button class="chip" id="btnFull" type="button">Vollbild</button>
      <button class="chip" id="btnEditor" type="button">Level-Editor</button>
      <button class="chip" id="btnSess" type="button">Sitzung</button>
    </div>
  </header>
  <section class="tview" id="view" aria-live="polite">
    <div class="card"><h2>Verbinde …</h2><p>Der Klassenraum wird vorbereitet.</p></div>
  </section>
  <section id="editorHost" hidden></section>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="dlg" id="dlg" hidden>
    <div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlgT">
      <h2 id="dlgT">Sitzung</h2>
      <p>Code dieser Sitzung: <b id="dlgCode"></b>. Namen und Zeiten werden 6 Stunden nach der letzten Änderung automatisch gelöscht.</p>
      <div class="dlg-actions">
        <button class="ghost-btn" id="btnNewSess" type="button">Neue Sitzung mit neuem QR-Code</button>
        <button class="ghost-btn danger" id="btnWipe" type="button">Sitzung beenden und Daten jetzt löschen</button>
        <button class="big-btn" id="btnDlgClose" type="button">Zurück</button>
      </div>
    </div>
  </div>
</main>
<script src="js/engine.js"></script>
<script src="js/gfx.js"></script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/play.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/net.js"></script>
<script src="js/editor.js"></script>
<script src="js/lehrer.js"></script>
</body>
</html>
